version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: preyt-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - api

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: preyt-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_BACKEND_URL=https://api.preyt.integralgroups.in
    depends_on:
      - api

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: preyt-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_SYNC_URL=postgresql+psycopg2://${POSTGRES_USER:-preyt}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-preyt}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-preyt}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-preyt}
      - REDIS_URL=redis://redis:6379/0
      - PORT=8000
    volumes:
      - preyt-storage:/var/preyt/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: preyt-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-preyt}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-preyt}
    volumes:
      - preyt-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-preyt} -d ${POSTGRES_DB:-preyt}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: preyt-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - preyt-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  preyt-pgdata:
  preyt-redisdata:
  preyt-storage:
