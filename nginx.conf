worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    sendfile        on;
    keepalive_timeout 65;

    # Frontend upstream
    upstream frontend {
        server frontend:3000;
    }

    # API upstream
    upstream api {
        server api:8000;
    }

    server {
        listen 80;
        server_name preyt.integralgroups.in api.preyt.integralgroups.in;

        # Note: In a real deployment, Certbot/Let's Encrypt would manage 443 
        # and port 80 would redirect to HTTPS. For this compose, we assume 
        # an external load balancer handles TLS or certs are mounted.

        # API routing (either via subdomain or path)
        # Using subdomain api.preyt.integralgroups.in
        server_name api.preyt.integralgroups.in;
        location / {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_addrs;
        }
    }

    server {
        listen 80;
        server_name preyt.integralgroups.in;

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_addrs;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
